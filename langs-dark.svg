<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 258" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;family=Caveat:wght@600;700&amp;display=swap');
      .mono { font-family: 'Fira Code', ui-monospace, monospace; }
      .hand { font-family: 'Caveat', 'Kalam', cursive, sans-serif; }
      
      @keyframes lang-grow {
        0% { width: 0; }
      }
      .lang-bar {
        animation: lang-grow 1.6s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
      }
    </style>
    
    <filter id="vercelDarkNoise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" result="noise"/>
      <feColorMatrix type="matrix" values="
        0.08 0 0 0 0.04
        0 0.08 0 0 0.04
        0 0 0.08 0 0.04
        0 0 0 0.12 0" result="coloredNoise"/>
      <feComposite operator="in" in2="SourceGraphic"/>
      <feBlend mode="screen" in="SourceGraphic" in2="coloredNoise"/>
    </filter>


    <pattern id="vercelGridDark" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#27272A" stroke-width="1"/>
    </pattern>

    <clipPath id="stackedBarClipDark">
      <rect x="22" y="74" width="436" height="12" rx="6"/>
    </clipPath>
  </defs>

  <!-- Dark Vercel Background -->
  <rect width="480" height="258" rx="16" fill="#0A0A0A" stroke="#27272A" stroke-width="2.5"/>
  <rect width="480" height="258" rx="16" fill="url(#vercelGridDark)" opacity="0.08"/>

  <!-- Inner Stroke Accent -->
  <rect x="3" y="3" width="474" height="252" rx="13" fill="none" stroke="#1F1F23" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <line x1="0" y1="36" x2="480" y2="36" stroke="#27272A" stroke-width="1.5"/>
  <circle cx="20" cy="18" r="4.5" fill="#8B0000"/>
  <circle cx="35" cy="18" r="4.5" fill="#FFD700"/>
  <circle cx="50" cy="18" r="4.5" fill="#2D2D3A"/>
  
  <text x="240" y="22" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#A1A1AA">geetansh@vercel-deploy:~$ <tspan fill="#F4F4F5">cat langs.md</tspan></text>

  <!-- Header Section (Icon + Top Languages) -->
  <g transform="translate(22, 48)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#FF5900"/>
    <text x="24" y="12" class="mono" font-size="14" font-weight="700" fill="#F4F4F5" letter-spacing="0.5">Top Languages</text>
  </g>

  <!-- Top Stacked Multi-Color Progress Bar (y=74, height=12) -->
  <rect x="22" y="74" width="436" height="12" rx="6" fill="#1C1C1E"/>
  <g clip-path="url(#stackedBarClipDark)">
    <rect x="22.0" y="74" width="221.7" height="12" fill="#1E3A8A" class="lang-bar"/>
    <rect x="243.7" y="74" width="146.2" height="12" fill="#8B0000" class="lang-bar"/>
    <rect x="389.9" y="74" width="68.1" height="12" fill="#FFD700" class="lang-bar"/>
  </g>

  <!-- Language List Items (Vertical Rows) -->
    <!-- Item: CSS (50.8%) -->
  <g transform="translate(22, 98.0)">
    <circle cx="6" cy="10" r="5" fill="#1E3A8A"/>
    <text x="20" y="14" class="mono" font-size="13" font-weight="700" fill="#FFFFFF">CSS</text>
    <text x="436" y="14" text-anchor="end" class="mono" font-size="13" font-weight="700" fill="#1E3A8A">50.8%</text>
    <rect x="20" y="22" width="416" height="8" rx="4" fill="#1C1C1E"/>
    <rect x="20" y="22" width="211.5" height="8" rx="4" fill="#1E3A8A" class="lang-bar"/>
  </g>

  <!-- Item: HTML (33.5%) -->
  <g transform="translate(22, 155.0)">
    <circle cx="6" cy="10" r="5" fill="#8B0000"/>
    <text x="20" y="14" class="mono" font-size="13" font-weight="700" fill="#FFFFFF">HTML</text>
    <text x="436" y="14" text-anchor="end" class="mono" font-size="13" font-weight="700" fill="#8B0000">33.5%</text>
    <rect x="20" y="22" width="416" height="8" rx="4" fill="#1C1C1E"/>
    <rect x="20" y="22" width="139.5" height="8" rx="4" fill="#8B0000" class="lang-bar"/>
  </g>

  <!-- Item: JavaScript (15.6%) -->
  <g transform="translate(22, 212.0)">
    <circle cx="6" cy="10" r="5" fill="#FFD700"/>
    <text x="20" y="14" class="mono" font-size="13" font-weight="700" fill="#FFFFFF">JavaScript</text>
    <text x="436" y="14" text-anchor="end" class="mono" font-size="13" font-weight="700" fill="#FFD700">15.6%</text>
    <rect x="20" y="22" width="416" height="8" rx="4" fill="#1C1C1E"/>
    <rect x="20" y="22" width="65.0" height="8" rx="4" fill="#FFD700" class="lang-bar"/>
  </g>
</svg>