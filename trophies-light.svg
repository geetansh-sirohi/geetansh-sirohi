<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 220" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;family=Caveat:wght@600;700&amp;display=swap');
      .mono { font-family: 'Fira Code', ui-monospace, monospace; }
      .hand { font-family: 'Caveat', 'Kalam', cursive, sans-serif; }
      
      @keyframes popCell {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes rankGlow {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }
      @keyframes shineX2 {
        0% { transform: translateX(-200px) skewX(-15deg); }
        60%, 100% { transform: translateX(1320px) skewX(-15deg); }
      }
      .cell {
        opacity: 0;
        animation: popCell 0.55s cubic-bezier(0.2, 0.8, 0.3, 1.2) forwards;
      }
      .rk {
        animation: rankGlow 2.2s ease-in-out infinite;
      }
      .sh2 {
        animation: shineX2 5s ease-in-out 2s infinite;
      }
    </style>
    
    <linearGradient id="shg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tc">
      <rect x="0" y="0" width="1120" height="220" rx="14"/>
    </clipPath>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1120" height="220" rx="14" fill="#FDFBF7" stroke="#8B0000" stroke-width="2.5"/>

  <!-- Window Header -->
  <line x1="0" y1="36" x2="1120" y2="36" stroke="#8B0000" stroke-width="1.5"/>
  <circle cx="20" cy="18" r="4.5" fill="#8B0000"/>
  <circle cx="35" cy="18" r="4.5" fill="#FFD700"/>
  <circle cx="50" cy="18" r="4.5" fill="#2D2D3A"/>

  <!-- Header Title (Centered) -->
  <text x="560" y="22" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#8B0000">geetansh@figma-canvas:~$ cat trophies.md</text>

  <!-- Naruto Trophies Cards Grid -->
    <!-- Cell 1: Otaku Dev -->
  <g transform="translate(16, 52)">
    <g class="cell" style="animation-delay:0.30s">
      <!-- Card Frame -->
      <rect x="0" y="0" width="168" height="152" rx="16" fill="#FFFFFF" stroke="#FDBA74" stroke-opacity=".85" stroke-width="1.5"/>
      
      <!-- Emblem Area Background Circle -->
      <circle cx="84" cy="50" r="32" fill="#FFEDD5" opacity="0.4"/>
      
      <!-- Progress Ring -->
      <circle cx="84" cy="50" r="28" fill="none" stroke="#FFEDD5" stroke-width="3" stroke-linecap="round"/>
      <circle cx="84" cy="50" r="28" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round" stroke-dasharray="176" stroke-dashoffset="176" transform="rotate(-90 84 50)">
        <animate attributeName="stroke-dashoffset" from="176" to="0" dur="1.2s" begin="0.60s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
      </circle>
      
      <!-- Custom Vector Naruto Emblem -->
      <g transform="translate(68, 34)">
      <path d="M 16 3 C 24 3, 29 9, 29 16 C 29 23, 23 29, 16 29 C 9 29, 3 23, 3 16 C 3 10, 7 5, 12 4 M 12 4 C 8 7, 6 12, 6 16 C 6 21, 10 26, 16 26 C 21 26, 26 21, 26 16 C 26 11, 21 7, 16 7 C 12 7, 9 10, 9 14 C 9 17, 12 19, 15 19 C 17 19, 19 17, 19 15 C 19 13, 17 12, 16 12" fill="none" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
      
      <!-- Floating Rank Badge -->
      <g transform="translate(62, 72)">
        <rect x="0" y="0" width="44" height="18" rx="9" fill="#FFEDD5" stroke="#FED7AA" stroke-width="1"/>
        <text class="rk mono" x="22" y="12.5" text-anchor="middle" font-size="10" font-weight="800" fill="#C2410C" style="animation-delay:0.70s">SSS</text>
      </g>
      
      <!-- Title & Stats Details -->
      <text x="84" y="114" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#18181B">Otaku Dev</text>
      <text x="84" y="132" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#9A3412">Anime Sites x6</text>
    </g>
  </g>
  <!-- Cell 2: Starstruck -->
  <g transform="translate(200, 52)">
    <g class="cell" style="animation-delay:0.48s">
      <!-- Card Frame -->
      <rect x="0" y="0" width="168" height="152" rx="16" fill="#FFFFFF" stroke="#93C5FD" stroke-opacity=".85" stroke-width="1.5"/>
      
      <!-- Emblem Area Background Circle -->
      <circle cx="84" cy="50" r="32" fill="#DBEAFE" opacity="0.4"/>
      
      <!-- Progress Ring -->
      <circle cx="84" cy="50" r="28" fill="none" stroke="#DBEAFE" stroke-width="3" stroke-linecap="round"/>
      <circle cx="84" cy="50" r="28" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-dasharray="176" stroke-dashoffset="176" transform="rotate(-90 84 50)">
        <animate attributeName="stroke-dashoffset" from="176" to="0" dur="1.2s" begin="0.78s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
      </circle>
      
      <!-- Custom Vector Naruto Emblem -->
      <g transform="translate(68, 34)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 16 16" to="360 16 16" dur="8s" repeatCount="indefinite"/>
        <path d="M 16 3 L 19 13 L 29 16 L 19 19 L 16 29 L 13 19 L 3 16 L 13 13 Z" fill="#2563EB" stroke="#93C5FD" stroke-width="1"/>
        <circle cx="16" cy="16" r="3.5" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
      </g>
    </g>
      
      <!-- Floating Rank Badge -->
      <g transform="translate(62, 72)">
        <rect x="0" y="0" width="44" height="18" rx="9" fill="#DBEAFE" stroke="#BFDBFE" stroke-width="1"/>
        <text class="rk mono" x="22" y="12.5" text-anchor="middle" font-size="10" font-weight="800" fill="#1E40AF" style="animation-delay:0.88s">S</text>
      </g>
      
      <!-- Title & Stats Details -->
      <text x="84" y="114" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#18181B">Starstruck</text>
      <text x="84" y="132" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#1E3A8A">GitHub Badge</text>
    </g>
  </g>
  <!-- Cell 3: Stargazer -->
  <g transform="translate(384, 52)">
    <g class="cell" style="animation-delay:0.66s">
      <!-- Card Frame -->
      <rect x="0" y="0" width="168" height="152" rx="16" fill="#FFFFFF" stroke="#FDA4AF" stroke-opacity=".85" stroke-width="1.5"/>
      
      <!-- Emblem Area Background Circle -->
      <circle cx="84" cy="50" r="32" fill="#FFE4E6" opacity="0.4"/>
      
      <!-- Progress Ring -->
      <circle cx="84" cy="50" r="28" fill="none" stroke="#FFE4E6" stroke-width="3" stroke-linecap="round"/>
      <circle cx="84" cy="50" r="28" fill="none" stroke="#E11D48" stroke-width="3" stroke-linecap="round" stroke-dasharray="176" stroke-dashoffset="176" transform="rotate(-90 84 50)">
        <animate attributeName="stroke-dashoffset" from="176" to="176" dur="1.2s" begin="0.96s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
      </circle>
      
      <!-- Custom Vector Naruto Emblem -->
      <g transform="translate(68, 34)">
      <rect x="15" y="24" width="2" height="6" rx="0.5" fill="#FDA4AF" stroke="#FDA4AF" stroke-width="0.5" />
      <path d="M 5 14 A 11 11 0 0 1 27 14 Z" fill="#E11D48" stroke="#FDA4AF" stroke-width="1.2" />
      <path d="M 5 14 A 11 11 0 0 0 27 14 Z" fill="#FFE4E6" stroke="#FDA4AF" stroke-width="1.2" />
    </g>
      
      <!-- Floating Rank Badge -->
      <g transform="translate(62, 72)">
        <rect x="0" y="0" width="44" height="18" rx="9" fill="#FFE4E6" stroke="#FECDD3" stroke-width="1"/>
        <text class="rk mono" x="22" y="12.5" text-anchor="middle" font-size="10" font-weight="800" fill="#9F1239" style="animation-delay:1.06s">B</text>
      </g>
      
      <!-- Title & Stats Details -->
      <text x="84" y="114" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#18181B">Stargazer</text>
      <text x="84" y="132" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#881337">Stars 0</text>
    </g>
  </g>
  <!-- Cell 4: Rising Star -->
  <g transform="translate(568, 52)">
    <g class="cell" style="animation-delay:0.84s">
      <!-- Card Frame -->
      <rect x="0" y="0" width="168" height="152" rx="16" fill="#FFFFFF" stroke="#86EFAC" stroke-opacity=".85" stroke-width="1.5"/>
      
      <!-- Emblem Area Background Circle -->
      <circle cx="84" cy="50" r="32" fill="#DCFCE7" opacity="0.4"/>
      
      <!-- Progress Ring -->
      <circle cx="84" cy="50" r="28" fill="none" stroke="#DCFCE7" stroke-width="3" stroke-linecap="round"/>
      <circle cx="84" cy="50" r="28" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-dasharray="176" stroke-dashoffset="176" transform="rotate(-90 84 50)">
        <animate attributeName="stroke-dashoffset" from="176" to="163" dur="1.2s" begin="1.14s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
      </circle>
      
      <!-- Custom Vector Naruto Emblem -->
      <g transform="translate(68, 34)">
      <path d="M 7,16 C 7,22 13,25 21,23 C 24,22 27,19 27,19 L 23,17 M 27,19 L 24,22 M 16,16 A 3,3 0 1,1 13,14" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="5" y1="19" x2="8" y2="18" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/>
    </g>
      
      <!-- Floating Rank Badge -->
      <g transform="translate(62, 72)">
        <rect x="0" y="0" width="44" height="18" rx="9" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="1"/>
        <text class="rk mono" x="22" y="12.5" text-anchor="middle" font-size="10" font-weight="800" fill="#166534" style="animation-delay:1.24s">B</text>
      </g>
      
      <!-- Title & Stats Details -->
      <text x="84" y="114" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#18181B">Rising Star</text>
      <text x="84" y="132" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#14532D">Followers 2</text>
    </g>
  </g>
  <!-- Cell 5: Committer -->
  <g transform="translate(752, 52)">
    <g class="cell" style="animation-delay:1.02s">
      <!-- Card Frame -->
      <rect x="0" y="0" width="168" height="152" rx="16" fill="#FFFFFF" stroke="#FCA5A5" stroke-opacity=".85" stroke-width="1.5"/>
      
      <!-- Emblem Area Background Circle -->
      <circle cx="84" cy="50" r="32" fill="#FFE4E6" opacity="0.4"/>
      
      <!-- Progress Ring -->
      <circle cx="84" cy="50" r="28" fill="none" stroke="#FFE4E6" stroke-width="3" stroke-linecap="round"/>
      <circle cx="84" cy="50" r="28" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round" stroke-dasharray="176" stroke-dashoffset="176" transform="rotate(-90 84 50)">
        <animate attributeName="stroke-dashoffset" from="176" to="148" dur="1.2s" begin="1.32s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
      </circle>
      
      <!-- Custom Vector Naruto Emblem -->
      <g transform="translate(68, 34)">
      <g>
        <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
        <path d="M 16,3 C 17.5,6 20,7.5 22,10 C 24.5,13 25,17 23,21 C 21,25 18,27 15,27 C 11,27 7.5,24 7,19 C 6.5,14 9,10 12,8 C 12,8 11.5,7 11.5,5.5 C 11.5,3.5 13.5,3 16,3 Z" fill="#DC2626" stroke="#FCA5A5" stroke-width="1"/>
      </g>
    </g>
      
      <!-- Floating Rank Badge -->
      <g transform="translate(62, 72)">
        <rect x="0" y="0" width="44" height="18" rx="9" fill="#FFE4E6" stroke="#FECDD3" stroke-width="1"/>
        <text class="rk mono" x="22" y="12.5" text-anchor="middle" font-size="10" font-weight="800" fill="#991B1B" style="animation-delay:1.42s">B</text>
      </g>
      
      <!-- Title & Stats Details -->
      <text x="84" y="114" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#18181B">Committer</text>
      <text x="84" y="132" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#7F1D1D">Commits 84</text>
    </g>
  </g>
  <!-- Cell 6: Creator -->
  <g transform="translate(936, 52)">
    <g class="cell" style="animation-delay:1.20s">
      <!-- Card Frame -->
      <rect x="0" y="0" width="168" height="152" rx="16" fill="#FFFFFF" stroke="#FDE047" stroke-opacity=".85" stroke-width="1.5"/>
      
      <!-- Emblem Area Background Circle -->
      <circle cx="84" cy="50" r="32" fill="#FEF9C3" opacity="0.4"/>
      
      <!-- Progress Ring -->
      <circle cx="84" cy="50" r="28" fill="none" stroke="#FEF9C3" stroke-width="3" stroke-linecap="round"/>
      <circle cx="84" cy="50" r="28" fill="none" stroke="#CA8A04" stroke-width="3" stroke-linecap="round" stroke-dasharray="176" stroke-dashoffset="176" transform="rotate(-90 84 50)">
        <animate attributeName="stroke-dashoffset" from="176" to="49" dur="1.2s" begin="1.50s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
      </circle>
      
      <!-- Custom Vector Naruto Emblem -->
      <g transform="translate(68, 34)">
      <line x1="7" y1="4" x2="7" y2="28" stroke="#FDE047" stroke-width="2" stroke-linecap="round" />
      <line x1="25" y1="4" x2="25" y2="28" stroke="#FDE047" stroke-width="2" stroke-linecap="round" />
      <rect x="5" y="6" width="4" height="20" rx="1" fill="#CA8A04" stroke="#FDE047" stroke-width="1" />
      <rect x="23" y="6" width="4" height="20" rx="1" fill="#CA8A04" stroke="#FDE047" stroke-width="1" />
      <rect x="9" y="8" width="14" height="16" fill="#FEF9C3" stroke="#FDE047" stroke-dasharray="2 2" stroke-width="1" />
      <circle cx="16" cy="16" r="3" fill="none" stroke="#CA8A04" stroke-width="1" />
      <path d="M 14,16 L 18,16 M 16,14 L 16,18" stroke="#CA8A04" stroke-width="1" />
    </g>
      
      <!-- Floating Rank Badge -->
      <g transform="translate(62, 72)">
        <rect x="0" y="0" width="44" height="18" rx="9" fill="#FEF9C3" stroke="#FEF08A" stroke-width="1"/>
        <text class="rk mono" x="22" y="12.5" text-anchor="middle" font-size="10" font-weight="800" fill="#854D0E" style="animation-delay:1.60s">A</text>
      </g>
      
      <!-- Title & Stats Details -->
      <text x="84" y="114" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#18181B">Creator</text>
      <text x="84" y="132" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#713F12">Repos 11</text>
    </g>
  </g>

  <!-- Shine overlay across the whole strip -->
  <g clip-path="url(#tc)">
    <rect class="sh2" x="0" y="0" width="140" height="220" fill="url(#shg2)"/>
  </g>
</svg>