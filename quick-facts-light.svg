<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;family=Outfit:wght@500;600;800&amp;display=swap');
      .mono { font-family: 'Fira Code', ui-monospace, monospace; }
      .sans { font-family: 'Outfit', sans-serif; }
      
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        fill: #FF5900;
        animation: blink 1s step-end infinite;
      }
    </style>
    <pattern id="figmaGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Light Vintage Paper Background (Figma Style) -->
  <rect width="540" height="440" rx="16" fill="#FDFBF7" stroke="#18181B" stroke-width="2.5"/>
  <rect width="540" height="440" rx="16" fill="url(#figmaGrid)" opacity="0.08"/>

  <!-- Window Header Bar -->
  <rect x="0" y="0" width="540" height="38" rx="16" fill="#EFECE6" stroke="#18181B" stroke-width="2.5"/>
  <rect x="0" y="20" width="540" height="18" fill="#EFECE6"/>
  <line x1="0" y1="38" x2="540" y2="38" stroke="#18181B" stroke-width="1.5"/>
  
  <!-- Mac Window Buttons -->
  <circle cx="20" cy="19" r="5" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5"/>
  <circle cx="36" cy="19" r="5" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5"/>
  <circle cx="52" cy="19" r="5" fill="#27C93F" stroke="#1AAB2F" stroke-width="0.5"/>

  <!-- Editor Tabs -->
  <g transform="translate(85, 8)">
    <!-- Active Tab -->
    <path d="M 0 30 L 10 5 A 4 4 0 0 1 14 2 L 140 2 A 4 4 0 0 1 144 5 L 154 30 Z" fill="#FDFBF7" stroke="#18181B" stroke-width="1.5"/>
    <rect x="1" y="28" width="152" height="4" fill="#FDFBF7"/>
    <!-- Orange active line at the top -->
    <path d="M 14 2 L 140 2" stroke="#FF5900" stroke-width="2"/>
    <text x="77" y="19" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#18181B">quick_facts.json</text>
    <circle cx="134" cy="15" r="4.5" fill="#FF5900" opacity="0.8"/>
    <text x="134" y="18" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#FFFFFF">x</text>
  </g>

  <g transform="translate(245, 8)">
    <!-- Inactive Tab -->
    <path d="M 0 30 L 10 5 A 4 4 0 0 1 14 2 L 110 2 A 4 4 0 0 1 114 5 L 124 30 Z" fill="#E5E2DA" stroke="#18181B" stroke-width="1.5"/>
    <text x="62" y="19" text-anchor="middle" class="sans" font-size="11" font-weight="500" fill="#6B7280">README.md</text>
  </g>

  <!-- Breadcrumbs / File Path Bar -->
  <g transform="translate(0, 38)">
    <rect x="0" y="0" width="540" height="24" fill="#F3F0E8" stroke="#18181B" stroke-width="1.5"/>
    <text x="20" y="16" class="sans" font-size="10.5" font-weight="500" fill="#6B7280">src <tspan fill="#A09C94">»</tspan> config <tspan fill="#A09C94">»</tspan> quick_facts.json</text>
  </g>

  <!-- Code Area -->
  <g transform="translate(0, 62)">
    <!-- Line Numbers Background -->
    <rect x="1" y="1" width="45" height="375" fill="#EFECE6" opacity="0.3"/>
    <line x1="45" y1="0" x2="45" y2="376" stroke="#EFECE6" stroke-width="1.5"/>

    <!-- Line Numbers -->
    <g class="mono" font-size="12" fill="#A09C94" text-anchor="end">
      <text x="32" y="30">01</text>
      <text x="32" y="52">02</text>
      <text x="32" y="74">03</text>
      <text x="32" y="96">04</text>
      <text x="32" y="118">05</text>
      <text x="32" y="140">06</text>
      <text x="32" y="162">07</text>
      <text x="32" y="184">08</text>
      <text x="32" y="206">09</text>
      <text x="32" y="228">10</text>
      <text x="32" y="250">11</text>
      <text x="32" y="272">12</text>
      <text x="32" y="294">13</text>
      <text x="32" y="316">14</text>
    </g>

    <!-- Syntax Highlighted JSON Code -->
    <g class="mono" font-size="12.5" font-weight="600" fill="#18181B" xml:space="preserve">
      <style>
        .punc-l { fill: #18181B; }
        .key-l { fill: #8B0000; }
        .val-l { fill: #1E3A8A; }
        .spec-l { fill: #FF5900; }
        .bio-l { fill: #2E7D32; font-style: italic; }
      </style>

      <text x="55" y="30" class="punc-l">{</text>
      
      <text x="70" y="52"><tspan class="key-l">"name"</tspan><tspan class="punc-l">:</tspan> <tspan class="val-l">"Geetansh Sirohi"</tspan><tspan class="punc-l">,</tspan></text>
      
      <text x="70" y="74"><tspan class="key-l">"role"</tspan><tspan class="punc-l">:</tspan> <tspan class="val-l">"Systems Architect &amp; Frontend Engineer"</tspan><tspan class="punc-l">,</tspan></text>
      
      <text x="70" y="96"><tspan class="key-l">"base"</tspan><tspan class="punc-l">:</tspan> <tspan class="val-l">"Rustampur, Uttar Pradesh, India"</tspan><tspan class="punc-l">,</tspan></text>
      
      <text x="70" y="118"><tspan class="key-l">"focus"</tspan><tspan class="punc-l">:</tspan> <tspan class="punc-l">[</tspan></text>
      <text x="90" y="140"><tspan class="val-l">"High-Performance Web Systems"</tspan><tspan class="punc-l">,</tspan></text>
      <text x="90" y="162"><tspan class="val-l">"XR/VR &amp; 3D Graphics"</tspan></text>
      <text x="70" y="184"><tspan class="punc-l">],</tspan></text>
      
      <text x="70" y="206"><tspan class="key-l">"stack"</tspan><tspan class="punc-l">:</tspan> <tspan class="punc-l">[</tspan></text>
      <text x="90" y="228"><tspan class="val-l">"React 19"</tspan><tspan class="punc-l">,</tspan> <tspan class="val-l">"Next.js 16"</tspan><tspan class="punc-l">,</tspan> <tspan class="val-l">"TypeScript"</tspan><tspan class="punc-l">,</tspan></text>
      <text x="90" y="250"><tspan class="val-l">"Tailwind CSS v4"</tspan><tspan class="punc-l">,</tspan> <tspan class="val-l">"Three.js"</tspan><tspan class="punc-l">,</tspan> <tspan class="val-l">"Cloudflare Workers"</tspan></text>
      <text x="70" y="272"><tspan class="punc-l">],</tspan></text>
      
      <text x="70" y="294"><tspan class="key-l">"bio"</tspan><tspan class="punc-l">:</tspan> <tspan class="bio-l">"code is my canvas, the web is my playground"</tspan><tspan class="cursor">█</tspan></text>
      
      <text x="55" y="316" class="punc-l">}</text>
    </g>
  </g>
</svg>