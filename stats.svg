<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 225" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;family=Caveat:wght@600;700&amp;display=swap');
      .mono { font-family: 'Fira Code', ui-monospace, monospace; }
      .hand { font-family: 'Caveat', 'Kalam', cursive, sans-serif; }
      
      @keyframes progress-fill {
        0% { stroke-dashoffset: 260; }
        100% { stroke-dashoffset: 45; }
      }
      .rank-ring {
        stroke-dasharray: 260;
        animation: progress-fill 2s ease-out forwards;
      }
      
      @keyframes bar-grow {
        0% { width: 0; }
      }
      .bar-anim {
        animation: bar-grow 1.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
      }
    </style>
    
    <filter id="paperTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feColorMatrix type="matrix" values="
        0.2 0 0 0 0.8
        0 0.2 0 0 0.78
        0 0 0.2 0 0.72
        0 0 0 0.08 0" result="coloredNoise"/>
      <feComposite operator="in" in2="SourceGraphic"/>
      <feBlend mode="multiply" in="SourceGraphic" in2="coloredNoise"/>
    </filter>

    <pattern id="statGridLight" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 0 0 0 15" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Vintage Paper Background & Frame -->
  <rect width="480" height="225" rx="14" fill="#FDFBF7" stroke="#8B0000" stroke-width="2.5"/>
  <rect width="480" height="225" rx="14" fill="url(#statGridLight)" opacity="0.08"/>

  <!-- Window Header -->
  <line x1="0" y1="36" x2="480" y2="36" stroke="#8B0000" stroke-width="1.5"/>
  <circle cx="20" cy="18" r="4.5" fill="#8B0000"/>
  <circle cx="35" cy="18" r="4.5" fill="#FFD700"/>
  <circle cx="50" cy="18" r="4.5" fill="#2D2D3A"/>

  <!-- Header Title (Centered) -->
  <text x="240" y="22" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#8B0000">geetansh@figma-canvas:~$ cat stats.md</text>

  <!-- Rank Circle Left (x=70, y=130) -->
  <g transform="translate(70, 130)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="#E2E8F0" stroke-width="6"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#8B0000" stroke-width="6" stroke-linecap="round" class="rank-ring" transform="rotate(-90)"/>
    <text x="0" y="6" text-anchor="middle" class="hand" font-size="32" font-weight="700" fill="#8B0000">A+</text>
    <text x="0" y="24" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#FF5900">TOP 1%</text>
  </g>

  <!-- Stat Rows Right (x=150) -->
  <g transform="translate(150, 52)">
    <!-- Row 1: Commits -->
    <text x="0" y="15" class="mono" font-size="11" font-weight="600" fill="#18181B">Total Commits</text>
    <text x="220" y="15" text-anchor="end" class="mono" font-size="11" font-weight="700" fill="#8B0000">84</text>
    <rect x="0" y="22" width="220" height="8" rx="4" fill="#EFECE6"/>
    <rect x="0" y="22" width="123.2" height="8" rx="4" fill="#8B0000" class="bar-anim"/>

    <!-- Row 2: Stars Received -->
    <text x="0" y="48" class="mono" font-size="11" font-weight="600" fill="#18181B">Stars Received</text>
    <text x="220" y="48" text-anchor="end" class="mono" font-size="11" font-weight="700" fill="#FF5900">0</text>
    <rect x="0" y="55" width="220" height="8" rx="4" fill="#EFECE6"/>
    <rect x="0" y="55" width="15.0" height="8" rx="4" fill="#FF5900" class="bar-anim"/>

    <!-- Row 3: Pull Requests -->
    <text x="0" y="81" class="mono" font-size="11" font-weight="600" fill="#18181B">Pull Requests</text>
    <text x="220" y="81" text-anchor="end" class="mono" font-size="11" font-weight="700" fill="#FFC107">0</text>
    <rect x="0" y="88" width="220" height="8" rx="4" fill="#EFECE6"/>
    <rect x="0" y="88" width="15.0" height="8" rx="4" fill="#FFC107" class="bar-anim"/>

    <!-- Row 4: Public Repos -->
    <text x="0" y="114" class="mono" font-size="11" font-weight="600" fill="#18181B">Public Repos</text>
    <text x="220" y="114" text-anchor="end" class="mono" font-size="11" font-weight="700" fill="#1E3A8A">11</text>
    <rect x="0" y="121" width="220" height="8" rx="4" fill="#EFECE6"/>
    <rect x="0" y="121" width="161.3" height="8" rx="4" fill="#1E3A8A" class="bar-anim"/>
  </g>
</svg>